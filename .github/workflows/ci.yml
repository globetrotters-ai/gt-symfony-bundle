name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/php-cs-fixer check --diff
        env:
          PHP_CS_FIXER_IGNORE_ENV: '1'
      - run: vendor/bin/phpstan analyse --no-progress

  tests:
    name: PHP ${{ matrix.php }} × Symfony ${{ matrix.symfony }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        symfony: ['6.4.*', '7.4.*']
    env:
      SYMFONY_REQUIRE: ${{ matrix.symfony }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: flex
          coverage: none
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/phpunit

  # Single required status check. The matrix job names carry the PHP and
  # Symfony versions, so requiring them in branch protection would break every
  # time the matrix moves; require THIS instead. It always runs and passes only
  # when every needed job succeeded (one `tests` need covers the whole matrix).
  # Neither job can be skipped, so `skipped` is a failure here: accept it only
  # once a job gains a legitimate `if:`. Under `workflow_call` (release.yml) it
  # runs as `CI / ci-ok`.
  ci-ok:
    if: ${{ always() }}
    needs: [lint, tests]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs succeeded
        run: |
          for r in ${{ join(needs.*.result, ' ') }}; do
            if [[ "$r" != "success" ]]; then
              echo "Required job result: $r — failing."
              exit 1
            fi
          done
          echo "All required jobs passed."
