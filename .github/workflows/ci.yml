name: CI

on:
  # Every branch, so a secret is caught the moment it is pushed; the lint and
  # test jobs still run on a push only for main (and a release tag, through
  # workflow_call), and on pull requests.
  push:
  pull_request:
  workflow_call:

jobs:
  secrets:
    name: Secrets scan
    runs-on: ubuntu-latest
    env:
      # The binary, not gitleaks/gitleaks-action, which needs a paid license
      # on organisation repositories. Pinned by version and checksum.
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP" gitleaks
          rm gitleaks.tar.gz
      # The whole history, not only the new commits: a secret stays readable
      # in any commit a public clone can reach.
      - name: Scan the history
        run: '"$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --no-banner --verbose .'

  lint:
    name: Lint
    if: github.event_name != 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/php-cs-fixer check --diff
        env:
          PHP_CS_FIXER_IGNORE_ENV: '1'
      - run: vendor/bin/phpstan analyse --no-progress

  tests:
    name: PHP ${{ matrix.php }} × Symfony ${{ matrix.symfony }}
    if: github.event_name != 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        symfony: ['6.4.*', '7.4.*']
    env:
      SYMFONY_REQUIRE: ${{ matrix.symfony }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: flex
          coverage: none
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/phpunit

  # Single required status check. The matrix job names carry the PHP and
  # Symfony versions, so requiring them in branch protection would break every
  # time the matrix moves; require THIS instead. It passes only when every
  # needed job succeeded (one `tests` need covers the whole matrix). It carries
  # the lint/test guard inside `always()`: on a non-main branch push it is
  # skipped with them (the secrets scan still reports on its own), and wherever
  # it runs every need runs too, so `skipped` counts as a failure. Under
  # `workflow_call` (release.yml) it runs as `CI / ci-ok`.
  ci-ok:
    if: ${{ always() && (github.event_name != 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
    needs: [secrets, lint, tests]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs succeeded
        run: |
          for r in ${{ join(needs.*.result, ' ') }}; do
            if [[ "$r" != "success" ]]; then
              echo "Required job result: $r — failing."
              exit 1
            fi
          done
          echo "All required jobs passed."
