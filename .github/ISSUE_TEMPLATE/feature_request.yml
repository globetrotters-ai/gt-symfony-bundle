name: Feature request
description: Suggest a change to what the bundle does.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like instead
  - type: textarea
    id: alternatives
    attributes:
      label: What you have tried or considered
